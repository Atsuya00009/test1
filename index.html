<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題トレーナー（リデザイン版）</title>
<style>
:root{
  /* Colorblind-safe palette */
  --ink:#222; --bg:#fff; --muted:#5b5b5b; --panel:#fafafa; --line:#e6e6e6;
  --ok:#1e88e5;  /* blue */
  --info:#2e7d32;/* green */
  --warn:#f57c00;/* orange */
  --err:#d32f2f; /* red (secondary cues only) */
  --chip:#eef; --chipfg:#224;
  --focus:#1565c0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
.container{
  max-width:800px;
  margin:0 auto;
  padding:20px;
}

header{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
h1{font-size:1.2rem;margin:0}
.pill{display:inline-flex;gap:8px;align-items:center;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-size:.8rem}
#settings{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:16px;
  align-items:end;
  margin:8px 0 14px;
}
#settings label{font-size:.9rem;color:#333;display:flex;flex-direction:column;gap:4px}
#settings input[type="number"]{width:7em}
select, input[type="number"], textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
button{
  padding:12px 20px;
  font-size:1.1rem;
  cursor:pointer;
  border-radius:8px;
  border:1px solid var(--line);
  background:#fff;
  transition:all 0.2s ease;
}
button:hover{
  filter:brightness(0.95);
}
button.primary{border-color:transparent;background:var(--ok);color:#fff}
button.ghost{border-style:dashed}
#question-body{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;line-height:1.8;min-height:84px;margin-top:14px}
.blank-input{margin:0 6px;padding:6px 8px;font-size:1rem;min-width:10em;border:1px solid var(--line);border-radius:4px}
.bank{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.bank .chip{border:1px solid var(--line);padding:4px 8px;border-radius:999px;cursor:pointer;background:#fff}
.choices{margin-top:12px;display:grid;gap:8px}
.choices label{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff;transition:all 0.2s ease;}
.choices label:hover{background:var(--panel);}
.choices input[type="radio"]{transform:scale(1.2);}
.controls{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
#meta{color:var(--muted);font-size:.9rem;margin-left:8px}
#progress{font-weight:600}
#result{margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid}
.badge.ok{border-color:var(--ok);background:#e8f2ff;color:#0d47a1}
.badge.ng{border-color:var(--warn);background:#fff2e0;color:#6a3b00}
.hint{margin-top:8px;color:#333;font-size:.95rem}
.hint .muted{color:var(--muted)}
#explain{
  margin-top:10px;
  padding:10px;
  border:1px dashed var(--line);
  border-radius:8px;
  background:#fcfcfc;
  display: none;
  overflow:hidden;
  transition: max-height 0.3s ease-in-out;
  max-height: 0;
}
#explain.open{
  max-height: 500px; /* Adjust as needed */
  display: block;
}
#explain .title{font-weight:700;margin-bottom:6px}
.reveal{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.reveal button{
  padding:8px 16px;
  font-size:0.95rem;
}
#scoreboard{
  margin-top:10px;
  padding:10px 16px;
  background:#f8f8f8;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
#scoreboard .bar{position:relative;flex:1 1 220px;height:10px;background:#eee;border-radius:999px;overflow:hidden}
#scoreboard .bar>i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#90caf9,#42a5f5);transition:width 0.3s ease-in-out;}
#final{display:none;margin-top:16px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fcfcfc}
#final h2{margin:0 0 8px;font-size:1.05rem}
#final ul{padding-left:1.25rem}
#alert{margin-left:8px;color:#b71c1c;font-weight:600}
#extras{margin-top:6px}
small.muted{color:var(--muted)}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:#fff}
/* focus ring */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width: 640px){
  .container{padding:14px}
  #settings{grid-template-columns:1fr;}
  .controls{flex-direction:column;align-items:stretch;}
  button{padding:12px;}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>問題トレーナー</h1>
    <span class="pill">データ: <b>questions.json</b> を自動読込</span>
  </header>

  <section id="scoreboard">
    <div>
      <span>スコア：<b id="scoreText">0 / 0</b>（<b id="scoreRate">0%</b>）</span>
      <span id="meta" style="margin-left:8px"></span>
    </div>
    <div class="bar"><i id="scoreFill"></i></div>
    <span>ショートカット：<kbd>Enter</kbd> 採点 / <kbd>N</kbd> 次へ</span>
  </section>

  <section id="settings">
    <label>モード
      <select id="mode">
        <option value="normal" selected>通常出題</option>
        <option value="wrong">誤答ノートから出題</option>
        <option value="due">今日の復習（間隔反復）</option>
      </select>
    </label>
    <label>科目
      <select id="subjectSelect">
        <option value="">すべて</option>
      </select>
    </label>
    <label>問題数
      <input type="number" id="countInput" min="1" value="20">
    </label>
    <label><input type="checkbox" id="shuffle" checked> ランダム</label>
    <button id="startBtn" class="primary">この設定で開始</button>
  </section>

  <main>
    <div id="question-body"><small class="muted">questions.json の読み込みを待機中…</small></div>
    <div id="extras"></div>

    <div id="result"></div>
    <div id="explain"></div>

    <div class="controls">
      <div id="confidence" style="display:none;align-items:center;gap:6px">
        <span class="muted">自信度：</span>
        <button data-c="1" title="全然自信なし（すぐ出す）">1</button>
        <button data-c="2" title="やや自信なし">2</button>
        <button data-c="3" title="やや自信あり">3</button>
        <button data-c="4" title="完全に覚えた">4</button>
      </div>
      <button id="submit" class="primary">採点</button>
      <button id="revealExplain" class="ghost">解説を表示</button>
      <button id="next">次の問題 ▶</button>
    </div>

    <section id="final">
      <h2>結果</h2>
      <p id="finalSummary"></p>
      <ul id="finalList"></ul>
    </section>
  </main>
</div>

<script>
/* ====== 状態と定数 ====== */
let ALL = [];
let QUESTIONS = [];
let IDX = 0, correctCount = 0, attempted = 0;
let history = [];
const WRONGBOOK_KEY = 'trainer_wrongbook_v1';
const THEME_KEY = 'trainer_theme_v1';

const els = {
  mode: document.getElementById('mode'),
  subject: document.getElementById('subjectSelect'),
  count: document.getElementById('countInput'),
  shuffle: document.getElementById('shuffle'),
  start: document.getElementById('startBtn'),
  qbody: document.getElementById('question-body'),
  extras: document.getElementById('extras'),
  result: document.getElementById('result'),
  explain: document.getElementById('explain'),
  revealExplain: document.getElementById('revealExplain'),
  confidence: document.getElementById('confidence'),
  meta: document.getElementById('meta'),
  progress: document.getElementById('progress'),
  scoreText: document.getElementById('scoreText'),
  scoreRate: document.getElementById('scoreRate'),
  scoreFill: document.getElementById('scoreFill'),
  submit: document.getElementById('submit'),
  next: document.getElementById('next'),
  final: document.getElementById('final'),
  finalSummary: document.getElementById('finalSummary'),
  finalList: document.getElementById('finalList'),
};

/* ====== テーマ切替 ====== */
function applyTheme(name){
  if(name==='classic'){
    document.documentElement.style.setProperty('--ok', '#2e7d32'); // green
    document.documentElement.style.setProperty('--warn', '#c62828'); // red-ish
  }else{
    document.documentElement.style.setProperty('--ok', '#1e88e5'); // blue
    document.documentElement.style.setProperty('--warn', '#f57c00'); // orange
  }
}
// 既存のテーマ切替機能は、今回のリデザインでは不要と判断し削除しました。
// もし必要であれば、元のコードから移植してください。

/* ====== 正規化・ユーティリティ ====== */
const FORM_MAP = {
  '穴埋め':'fill','fill':'fill',
  '〇×':'truefalse','○×':'truefalse','truefalse':'truefalse',
  '並べ替え':'order','並べ替え問題':'order','order':'order',
  '５択':'mcq','5択':'mcq','選択':'mcq','multi':'mcq','mcq':'mcq',
  '書き換え':'short','記述':'short','written':'short','rewrite':'short','short':'short'
};
function normalizeForm(s){ return FORM_MAP[s] || s; }

function tryParseJsonStringMaybeArray(x){
  if (typeof x === 'string'){
    const t = x.trim();
    if ((t.startsWith('[') && t.endsWith(']')) || (t.startsWith('{') && t.endsWith('}'))){
      try{ return JSON.parse(t); }catch(e){ return x; }
    }
    if (t.startsWith("['") || t.startsWith('["')){
      try{ const j = t.replace(/'/g, '"'); return JSON.parse(j); }catch(e){ return x; }
    }
  }
  return x;
}
function normalizeQuestions(arr){
  return arr.map(q=>{
    const out = { ...q };
    out.形式 = normalizeForm(String(out.形式||'').trim());
    if ('選択肢' in out){
      const parsed = tryParseJsonStringMaybeArray(out.選択肢);
      out.選択肢 = parsed;
      if (Array.isArray(out.選択肢) && out.選択肢.length===1 && typeof out.選択肢[0]==='string'){
        const p2 = tryParseJsonStringMaybeArray(out.選択肢[0]);
        if (Array.isArray(p2)) out.選択肢 = p2;
      }
    }
    if(out.形式==='truefalse' && (!Array.isArray(out.選択肢) || out.選択肢.length===0)){
      out.選択肢=['〇','×'];
    }
    if(out.形式==='order'){
      out.答え = tryParseJsonStringMaybeArray(out.答え);
      out.選択肢 = tryParseJsonStringMaybeArray(out.選択肢);
      if (Array.isArray(out.選択肢) && out.選択肢.length===1 && typeof out.選択肢[0]==='string'){
        const p = tryParseJsonStringMaybeArray(out.選択肢[0]);
        if (Array.isArray(p)) out.選択肢 = p;
      }
    }
    if(out.形式==='fill'){
      if(Array.isArray(out.答え)){}
      else if(typeof out.答え==='string' && out.答え.trim()){
        const parts = out.答え.split(/\s*\/\s*|\n/).map(s=>s.trim()).filter(Boolean);
        out.答え = parts.length>1 ? parts : [out.答え.trim()];
      }else{
        out.答え = [];
      }
    }
    if(!out.科目 || (typeof out.科目==='string' && out.科目.trim()==='')) out.科目 = '未分類';
    return out;
  });
}
function norm(s){return String(s??'').trim().normalize('NFKC').replace(/\s+/g,'');}

function countBlanks(text, answer){
  const m=(String(text||'').match(/（\s*?）/g)||[]).length;
  if(m === 0){return String(answer||'').split(/\s*\/\s*|\n/).length;}
  return m;
}

function renderQuestion(q){
  els.extras.innerHTML = '';
  els.explain.style.display = 'none';
  els.explain.classList.remove('open');
  els.result.innerHTML = '';
  els.confidence.style.display = 'none';
  els.submit.style.display = 'inline-block';
  els.next.style.display = 'none';
  els.revealExplain.style.display = 'inline-block';
  if(q.解説 && q.解説.trim()){
      els.explain.innerHTML = `<div class="title">解説：</div><div>${String(q.解説).replace(/\n/g,'<br>')}</div>`;
  } else {
      els.revealExplain.style.display = 'none';
  }
  
  const h = q.難易度 ? `<span class="pill">${q.難易度}</span>` : '';
  const meta = `${h} <span class="pill">形式: ${q.形式}</span>`;
  els.meta.innerHTML = meta;

  const content = q.問題文.replace(/\n/g,'<br>');

  switch(q.形式){
    case 'fill':
      let html = content;
      const inputs = q.答え.map((_, i) => `<input type="text" class="blank-input" data-idx="${i}" autocomplete="off">`);
      html = html.replace(/（\s*?）/g, () => inputs.shift());
      els.qbody.innerHTML = html;
      break;
    case 'mcq':
    case 'truefalse':
      const choices = q.選択肢.map((opt, i) =>
        `<label><input type="radio" name="choice" value="${i}" data-ans="${String(q.答え).trim()}"><span>${opt}</span></label>`
      ).join('');
      els.qbody.innerHTML = `${content}<div class="choices">${choices}</div>`;
      break;
    case 'order':
      const orderOptions = q.選択肢.map((opt, i) => `<div class="chip" draggable="true" ondragstart="drag(event)" data-idx="${i}">${opt}</div>`).join('');
      const orderHtml = `<div>${content}</div><div class="bank">${orderOptions}</div><div class="drop-area" ondrop="drop(event)" ondragover="allowDrop(event)"></div>`;
      els.qbody.innerHTML = orderHtml;
      break;
    default:
      els.qbody.innerHTML = `<small class="muted">この問題形式には対応していません: ${q.形式}</small>`;
      break;
  }
}

function checkAnswer(){
  const q = QUESTIONS[IDX];
  let correct = false;
  let userAnswer = '';
  switch(q.形式){
    case 'fill':
      const userAnswers = [...els.qbody.querySelectorAll('.blank-input')].map(input=>norm(input.value));
      const correctAnswers = q.答え.map(norm);
      correct = userAnswers.length === correctAnswers.length && userAnswers.every(ans=>correctAnswers.includes(ans));
      userAnswer = userAnswers;
      break;
    case 'mcq':
    case 'truefalse':
      const checked = els.qbody.querySelector('input[name="choice"]:checked');
      if(!checked){ els.result.innerHTML=`<span class="badge ng">回答が選択されていません</span>`; return; }
      userAnswer = checked.nextElementSibling.textContent;
      correct = (norm(userAnswer) === norm(q.答え)) || (norm(checked.dataset.ans) === norm(userAnswer));
      break;
    case 'order':
      const ordered = [...els.qbody.querySelectorAll('.drop-area .chip')].map(chip=>chip.textContent);
      userAnswer = ordered;
      const correctOrder = q.答え;
      correct = JSON.stringify(ordered) === JSON.stringify(correctOrder);
      break;
    default:
      return;
  }
  
  if(correct){
    els.result.innerHTML=`<span class="badge ok">正解です！</span>`;
    correctCount++;
  }else{
    els.result.innerHTML=`<span class="badge ng">不正解です...</span>`;
    els.revealExplain.style.display = 'inline-block';
    
    // 不正解の時に答えをヒントとして表示
    if (q.形式 === 'fill') {
      const inputs = els.qbody.querySelectorAll('.blank-input');
      inputs.forEach((input, i) => {
        if (norm(input.value) !== norm(q.答え[i])) {
          input.value = q.答え[i];
          input.style.backgroundColor = '#ffe0e0';
        }
      });
    }
  }
  
  attempted++;
  history.push({id: q.id, correct, user: userAnswer, answer: q.答え});
  updateScoreboard();
  
  els.submit.style.display = 'none';
  els.next.style.display = 'inline-block';
}

function nextQuestion(){
  IDX++;
  if(IDX < QUESTIONS.length){
    renderQuestion(QUESTIONS[IDX]);
    updateProgress();
  }else{
    finishQuiz();
  }
}

function finishQuiz(){
  els.qbody.innerHTML = '';
  els.extras.innerHTML = '';
  els.result.innerHTML = '';
  els.controls.style.display = 'none';
  
  const total = QUESTIONS.length;
  const wrongCount = total - correctCount;
  els.finalSummary.textContent = `${total}問中、${correctCount}問正解です。間違えた問題は${wrongCount}問でした。`;
  
  els.finalList.innerHTML = '';
  history.forEach((h, i)=>{
    if(!h.correct){
      const li=document.createElement('li');
      li.textContent = `Q${i+1}（${h.id}）：あなたの回答 → ${Array.isArray(h.user)? h.user.join(' / ') : h.user}｜正解 → ${Array.isArray(h.answer)? h.answer.join(' / ') : h.answer}`;
      els.finalList.append(li);
    }
  });
  els.final.style.display='block';
  scrollIntoViewSmooth(els.final);
}

function updateScoreboard(){
  els.scoreText.textContent = `${correctCount} / ${attempted}`;
  const rate = attempted > 0 ? Math.floor((correctCount/attempted)*100) : 0;
  els.scoreRate.textContent = `${rate}%`;
  els.scoreFill.style.width = `${rate}%`;
}

function updateProgress(){
  const progressText = `現在の進捗: ${IDX + 1} / ${QUESTIONS.length}`;
  els.progress.textContent = progressText;
}

function startQuiz(){
  const count = parseInt(els.count.value, 10) || 20;
  const subject = els.subject.value;
  let questions = ALL;

  if (subject) {
    questions = questions.filter(q => q.科目 === subject);
  }

  if (els.shuffle.checked) {
    questions.sort(() => Math.random() - 0.5);
  }

  QUESTIONS = questions.slice(0, count);
  if(QUESTIONS.length === 0){
    els.alert.textContent = '該当する問題が見つかりませんでした。';
    return;
  }else{
    els.alert.textContent = '';
  }

  IDX = 0;
  correctCount = 0;
  attempted = 0;
  history = [];

  els.settings.style.display = 'none';
  els.final.style.display = 'none';
  els.controls.style.display = 'flex';
  
  renderQuestion(QUESTIONS[IDX]);
  updateScoreboard();
  updateProgress();
}

function toggleExplain(){
  els.explain.classList.toggle('open');
}

els.submit.addEventListener('click', checkAnswer);
els.next.addEventListener('click', nextQuestion);
els.start.addEventListener('click', startQuiz);
els.revealExplain.addEventListener('click', toggleExplain);

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && els.submit.style.display !== 'none') {
    checkAnswer();
  } else if (e.key === 'n' && els.next.style.display !== 'none') {
    nextQuestion();
  }
});

/* ====== データ読み込み（questions.json 優先） ====== */
function buildSubjects(){
  const subs=[...new Set(ALL.map(q=> (q.科目 && String(q.科目).trim()) ? String(q.科目).trim() : '未分類'))].sort();
  els.subject.innerHTML = '<option value="">すべて</option>' + subs.map(s=>`<option value="${s}">${s}</option>`).join('');
}
async function loadQuestionsJson(){
  const urls = ['questions.json','./questions.json','data/questions.json','./data/questions.json'];
  for(const url of urls){
    try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok){ return await r.json(); } }catch(_){}}
  throw new Error('questions.json not found');
}
loadQuestionsJson().then(data=>{
  ALL = normalizeQuestions(data);
  buildSubjects();
  els.qbody.innerHTML = `<small class="muted">データ読込完了。設定を選んで「開始」を押してください。</small>`;
}).catch(err=>{
  els.qbody.innerHTML = `<small class="muted">questions.json の読込に失敗しました: ${err.message}</small>`;
  els.start.disabled = true;
});

// Drag and Drop (Order Question)
function allowDrop(e){e.preventDefault();}
function drag(e){e.dataTransfer.setData("text", e.target.dataset.idx);}
function drop(e){
  e.preventDefault();
  const data = e.dataTransfer.getData("text");
  const chip = document.querySelector(`.chip[data-idx="${data}"]`);
  e.target.appendChild(chip);
}

// Smooth scrolling
function scrollIntoViewSmooth(el){
  el.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
