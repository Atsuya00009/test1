<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題トレーナー（暗記最適化版）</title>
<style>
:root{
  /* Colorblind-safe palette */
  --ink:#222; --bg:#fff; --muted:#5b5b5b; --panel:#fafafa; --line:#e6e6e6;
  --ok:#1e88e5;  /* blue */
  --info:#2e7d32;/* green */
  --warn:#f57c00;/* orange */
  --err:#d32f2f; /* red (secondary cues only) */
  --chip:#eef; --chipfg:#224;
  --focus:#1565c0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:20px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
h1{font-size:1.2rem;margin:0}
.pill{display:inline-flex;gap:8px;align-items:center;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--chipfg);font-size:.8rem}
#settings{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:8px 0 14px}
#settings label{font-size:.9rem;color:#333;display:flex;flex-direction:column;gap:4px}
#settings input[type="number"]{width:7em}
select, input[type="number"], textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
button{padding:8px 12px;font-size:1rem;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff}
button.primary{border-color:transparent;background:var(--ok);color:#fff}
button.ghost{border-style:dashed}
#question-body{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;line-height:1.8;min-height:84px}
.blank-input{margin:0 6px;padding:6px 8px;font-size:1rem;min-width:10em}
.bank{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.bank .chip{border:1px solid var(--line);padding:4px 8px;border-radius:999px;cursor:pointer;background:#fff}
.choices{margin-top:12px;display:grid;gap:8px}
.choices label{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
#meta{color:var(--muted);font-size:.9rem;margin-left:8px}
#progress{font-weight:600}
#result{margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid}
.badge.ok{border-color:var(--ok);background:#e8f2ff;color:#0d47a1}
.badge.ng{border-color:var(--warn);background:#fff2e0;color:#6a3b00}
.hint{margin-top:8px;color:#333;font-size:.95rem}
.hint .muted{color:var(--muted)}
#explain{display:none;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:#fcfcfc}
#explain .title{font-weight:700;margin-bottom:6px}
.reveal{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
#scoreboard{margin-top:10px;color:#333;font-size:.95rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#scoreboard .bar{position:relative;flex:1 1 220px;height:10px;background:#eee;border-radius:999px;overflow:hidden}
#scoreboard .bar>i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#90caf9,#42a5f5)}
#final{display:none;margin-top:16px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fcfcfc}
#final h2{margin:0 0 8px;font-size:1.05rem}
#final ul{padding-left:1.25rem}
#alert{margin-left:8px;color:#b71c1c;font-weight:600}
#extras{margin-top:6px}
small.muted{color:var(--muted)}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:#fff}
/* focus ring */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width: 640px){ body{margin:14px} }
</style>
</head>
<body>
<header>
  <h1>問題トレーナー</h1>
  <span id="meta"></span>
  <span id="alert"></span>
  <span class="pill">データ: <b>questions.json</b> を自動読込</span>
  <span class="pill">配色: <select id="theme">
    <option value="safe" selected>色覚セーフ</option>
    <option value="classic">従来（緑/赤強調）</option>
  </select></span>
</header>

<section id="settings">
  <label>モード
    <select id="mode">
      <option value="normal" selected>通常出題</option>
      <option value="wrong">誤答ノートから出題</option>
      <option value="due">今日の復習（間隔反復）</option>
    </select>
  </label>
  <label>科目
    <select id="subjectSelect">
      <option value="">すべて</option>
    </select>
  </label>
  <label>問題数
    <input type="number" id="countInput" min="1" value="20">
  </label>
  <label><input type="checkbox" id="shuffle" checked> ランダム</label>
  <button id="startBtn" class="primary">この設定で開始</button>
  <span id="progress"></span>
</section>

<main>
  <div id="question-body"><small class="muted">questions.json の読み込みを待機中…</small></div>
  <div id="extras"></div>

  <div id="result"></div>
  <div class="reveal">
    <button id="revealExplain" class="ghost">解説を表示</button>
    <button id="revealAnswer" class="ghost">完全な答えを表示</button>
  </div>
  <div id="explain"></div>

  <div id="scoreboard">
    <span>スコア：<b id="scoreText">0 / 0</b>（<b id="scoreRate">0%</b>）</span>
    <div class="bar"><i id="scoreFill"></i></div>
    <span>ショートカット：<kbd>Enter</kbd> 採点 / <kbd>N</kbd> 次へ</span>
  </div>

  <div class="controls">
    <button id="submit">採点</button>
    <div id="confidence" style="display:none;align-items:center;gap:6px">
      <span class="muted">自信度：</span>
      <button data-c="1" title="全然自信なし（すぐ出す）">1</button>
      <button data-c="2" title="やや自信なし">2</button>
      <button data-c="3" title="やや自信あり">3</button>
      <button data-c="4" title="完全に覚えた">4</button>
    </div>
    <button id="next">次の問題 ▶</button>
  </div>

  <section id="final">
    <h2>結果</h2>
    <p id="finalSummary"></p>
    <ul id="finalList"></ul>
  </section>
</main>

<script>
/* ====== 状態と定数 ====== */
let ALL = [];
let QUESTIONS = [];
let IDX = 0, correctCount = 0, attempted = 0;
let history = [];
const WRONGBOOK_KEY = 'trainer_wrongbook_v1';
const THEME_KEY = 'trainer_theme_v1';

const els = {
  mode: document.getElementById('mode'),
  subject: document.getElementById('subjectSelect'),
  count: document.getElementById('countInput'),
  shuffle: document.getElementById('shuffle'),
  start: document.getElementById('startBtn'),
  qbody: document.getElementById('question-body'),
  extras: document.getElementById('extras'),
  result: document.getElementById('result'),
  explain: document.getElementById('explain'),
  revealExplain: document.getElementById('revealExplain'),
  revealAnswer: document.getElementById('revealAnswer'),
  confidence: document.getElementById('confidence'),
  meta: document.getElementById('meta'),
  alert: document.getElementById('alert'),
  progress: document.getElementById('progress'),
  scoreText: document.getElementById('scoreText'),
  scoreRate: document.getElementById('scoreRate'),
  scoreFill: document.getElementById('scoreFill'),
  submit: document.getElementById('submit'),
  next: document.getElementById('next'),
  final: document.getElementById('final'),
  finalSummary: document.getElementById('finalSummary'),
  finalList: document.getElementById('finalList'),
  theme: document.getElementById('theme'),
};

/* ====== テーマ切替 ====== */
function applyTheme(name){
  if(name==='classic'){
    document.documentElement.style.setProperty('--ok', '#2e7d32'); // green
    document.documentElement.style.setProperty('--warn', '#c62828'); // red-ish
  }else{
    document.documentElement.style.setProperty('--ok', '#1e88e5'); // blue
    document.documentElement.style.setProperty('--warn', '#f57c00'); // orange
  }
}
(function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved){ els.theme.value = saved; }
  applyTheme(els.theme.value);
  els.theme.addEventListener('change', ()=>{
    localStorage.setItem(THEME_KEY, els.theme.value);
    applyTheme(els.theme.value);
  });
})();

/* ====== 正規化・ユーティリティ ====== */
const FORM_MAP = {
  '穴埋め':'fill','fill':'fill',
  '〇×':'truefalse','○×':'truefalse','truefalse':'truefalse',
  '並べ替え':'order','並べ替え問題':'order','order':'order',
  '５択':'mcq','5択':'mcq','選択':'mcq','multi':'mcq','mcq':'mcq',
  '書き換え':'short','記述':'short','written':'short','rewrite':'short','short':'short'
};
function normalizeForm(s){ return FORM_MAP[s] || s; }

function tryParseJsonStringMaybeArray(x){
  if (typeof x === 'string'){
    const t = x.trim();
    if ((t.startsWith('[') && t.endsWith(']')) || (t.startsWith('{') && t.endsWith('}'))){
      try{ return JSON.parse(t); }catch(e){ return x; }
    }
    if (t.startsWith("['") || t.startsWith('["')){
      try{ const j = t.replace(/'/g, '"'); return JSON.parse(j); }catch(e){ return x; }
    }
  }
  return x;
}
function normalizeQuestions(arr){
  return arr.map(q=>{
    const out = { ...q };
    out.形式 = normalizeForm(String(out.形式||'').trim());
    if ('選択肢' in out){
      const parsed = tryParseJsonStringMaybeArray(out.選択肢);
      out.選択肢 = parsed;
      if (Array.isArray(out.選択肢) && out.選択肢.length===1 && typeof out.選択肢[0]==='string'){
        const p2 = tryParseJsonStringMaybeArray(out.選択肢[0]);
        if (Array.isArray(p2)) out.選択肢 = p2;
      }
    }
    if(out.形式==='truefalse' && (!Array.isArray(out.選択肢) || out.選択肢.length===0)){ out.選択肢=['〇','×']; }
    if(out.形式==='order'){
      out.答え = tryParseJsonStringMaybeArray(out.答え);
      out.選択肢 = tryParseJsonStringMaybeArray(out.選択肢);
      if (Array.isArray(out.選択肢) && out.選択肢.length===1 && typeof out.選択肢[0]==='string'){
        const p = tryParseJsonStringMaybeArray(out.選択肢[0]);
        if (Array.isArray(p)) out.選択肢 = p;
      }
    }
    if(out.形式==='fill'){
      if(Array.isArray(out.答え)){}
      else if(typeof out.答え==='string' && out.答え.trim()){
        const parts = out.答え.split(/\s*\/\s*|\n/).map(s=>s.trim()).filter(Boolean);
        out.答え = parts.length>1 ? parts : [out.答え.trim()];
      }else{ out.答え = []; }
    }
    if(!out.科目 || (typeof out.科目==='string' && out.科目.trim()==='')) out.科目 = '未分類';
    return out;
  });
}
function norm(s){return String(s??'').trim().normalize('NFKC').replace(/\s+/g,'');}
function countBlanks(text, answer){
  const m=(String(text||'').match(/（　　　）/g)||[]).length;
  if(m>0) return m;
  if(Array.isArray(answer)) return answer.length||1;
  return 1;
}
function setProgress(){els.progress.textContent = QUESTIONS.length? `Q ${IDX+1} / ${QUESTIONS.length}` : '';}
function setMeta(q){els.meta.textContent = `${q.id||''} ${q.科目? ' / '+q.科目 : ''}`; }
function updateScoreboard(){
  const total = attempted; const rate = total? Math.round(100*correctCount/total):0;
  els.scoreText.textContent = `${correctCount} / ${total}`;
  els.scoreRate.textContent = rate + '%';
  els.scoreFill.style.width = rate + '%';
}

/* ====== ヒント生成（控えめ） ====== */
function maskAnswer(a){
  if(Array.isArray(a)) { return a.map(maskAnswer).join(' / '); }
  const s = String(a||'');
  if(!s) return '';
  // 先頭と長さだけ示し、残りは・で伏せる
  const head = s.slice(0, 1);
  return `${head}${'・'.repeat(Math.max(0, Math.min(6, s.length-1)))}`;
}
function makeHint(q){
  if(q.形式==='order'){
    const first = Array.isArray(q.答え) && q.答え.length ? q.答え[0] : '';
    return first ? `最初は「${maskAnswer(first)}」から始まります。` : '順序の起点に注目。';
  }
  if(q.形式==='mcq' || q.形式==='truefalse'){
    return '選択肢を絞り込みましょう。明確に誤りを除くのがコツ。';
  }
  if(q.形式==='fill' || q.形式==='short'){
    const a = Array.isArray(q.答え)? q.答え[0] : q.答え;
    return a ? `ヒント：${maskAnswer(a)}` : 'キーワードの頭文字を思い出してみましょう。';
  }
  return '';
}

/* ====== レンダリング ====== */
function renderFill(q){
  els.qbody.innerHTML=els.extras.innerHTML=els.result.innerHTML=els.explain.innerHTML='';
  els.explain.style.display='none'; els.confidence.style.display='none';
  const n=countBlanks(q.問題文||'', q.答え);
  const parts=String(q.問題文||'').split('（　　　）');
  const choices=Array.isArray(q.選択肢)?q.選択肢:null;
  const isPerBlankChoices=Array.isArray(choices)&&Array.isArray(choices[0]);
  const isBank=Array.isArray(choices)&&!isPerBlankChoices;
  for(let i=0;i<parts.length;i++){
    els.qbody.append(document.createTextNode(parts[i]));
    if(i<n){
      let el;
      if(isPerBlankChoices){ el=document.createElement('select'); (choices[i]||[]).forEach(opt=>{const o=document.createElement('option'); o.value=String(opt); o.textContent=String(opt); el.appendChild(o);}); }
      else { el=document.createElement('input'); el.type='text'; el.placeholder=`空欄${i+1}`; el.autocomplete='off'; }
      el.className='blank-input'; el.dataset.blankIndex=i; els.qbody.append(el);
    }
  }
  if(isBank){
    const bank=document.createElement('div'); bank.className='bank';
    const tip=document.createElement('span'); tip.className='muted'; tip.textContent='（必要なときだけ開いて使うと記憶定着↑）';
    bank.append(tip);
    choices.forEach(opt=>{const chip=document.createElement('span'); chip.className='chip'; chip.textContent=String(opt); chip.onclick=()=>{const inputs=Array.from(document.querySelectorAll('.blank-input')); const target=inputs.find(x=>!x.value); if(target){target.value=String(opt); target.focus();}}; bank.append(chip);});
    els.extras.append(bank);
  }
  setMeta(q);
}
function renderMCQ(q){
  els.qbody.innerHTML=els.extras.innerHTML=els.result.innerHTML=els.explain.innerHTML='';
  els.explain.style.display='none'; els.confidence.style.display='none';
  const stem=document.createElement('div'); stem.textContent=q.問題文||''; els.qbody.append(stem);
  const box=document.createElement('div'); box.className='choices'; els.qbody.append(box);
  (q.選択肢||[]).forEach((opt,i)=>{
    const id='opt_'+i; const lbl=document.createElement('label');
    const inp=document.createElement('input'); inp.type='radio'; inp.name='mcq'; inp.value=String(opt); inp.id=id;
    const txt=document.createElement('span'); txt.textContent=String(opt);
    lbl.append(inp,txt); box.append(lbl);
  });
  setMeta(q);
}
function renderTF(q){ renderMCQ(q); }
function renderShort(q){
  els.qbody.innerHTML=els.extras.innerHTML=els.result.innerHTML=els.explain.innerHTML='';
  els.explain.style.display='none'; els.confidence.style.display='none';
  const stem=document.createElement('div'); stem.textContent=q.問題文||''; els.qbody.append(stem);
  const el=document.createElement('textarea'); el.rows=3; el.style.width='100%'; el.id='short-answer'; el.placeholder='ここに解答を入力'; els.qbody.append(el);
  setMeta(q);
}
function renderOrder(q){
  els.qbody.innerHTML=els.extras.innerHTML=els.result.innerHTML=els.explain.innerHTML='';
  els.explain.style.display='none'; els.confidence.style.display='none';
  const stem=document.createElement('div'); stem.textContent=q.問題文||''; els.qbody.append(stem);
  let items = Array.isArray(q.選択肢) ? q.選択肢.slice() : (Array.isArray(q.答え)? q.答え.slice(): []);
  for(let i=items.length-1;i>0;i++){const j=Math.random()*(i+1)|0; [items[i],items[j]]=[items[j],items[i]];}
  const ul=document.createElement('ol'); ul.id='order-list';
  items.forEach(x=>{
    const li=document.createElement('li'); li.textContent=String(x);
    const btns=document.createElement('span'); btns.style.marginLeft='8px';
    const up=document.createElement('button'); up.type='button'; up.textContent='↑'; up.onclick=()=>{ if(li.previousElementSibling) ul.insertBefore(li, li.previousElementSibling); };
    const dn=document.createElement('button'); dn.type='button'; dn.textContent='↓'; dn.onclick=()=>{ if(li.nextElementSibling) ul.insertBefore(li.nextElementSibling, li); };
    btns.append(up, dn); li.append(btns); ul.append(li);
  });
  els.qbody.append(ul); setMeta(q);
}
function renderQuestion(q){
  setProgress();
  if(q.形式==='fill') return renderFill(q);
  if(q.形式==='mcq') return renderMCQ(q);
  if(q.形式==='truefalse') return renderTF(q);
  if(q.形式==='short') return renderShort(q);
  if(q.形式==='order') return renderOrder(q);
  els.qbody.textContent=q.問題文||'';
}

/* ====== 採点 ====== */
function isCorrectForBlank(user, spec){
  if(Array.isArray(spec)) return spec.some(a=>norm(a)===norm(user));
  if(typeof spec==='string' && spec.includes(' / ')){ return spec.split(' / ').some(a=>norm(a)===norm(user)); }
  return norm(spec)===norm(user);
}
function gradeFill(q){
  const n=countBlanks(q.問題文||'', q.答え);
  const inputs=Array.from(document.querySelectorAll('.blank-input')).sort((a,b)=> (+a.dataset.blankIndex)-(+b.dataset.blankIndex));
  const user=inputs.map(el=>('value' in el)? el.value : el.options[el.selectedIndex]?.value ?? '');
  const ans=Array.isArray(q.答え)? q.答え : [q.答え??''];
  const per=[]; for(let i=0;i<n;i++){ const spec=ans[i]??''; per[i]=isCorrectForBlank(user[i], spec); inputs[i].style.borderColor= per[i] ? '#90caf9' : '#ffcc80'; }
  const correct=per.every(Boolean);
  const answerView = ans.map((a,i)=> Array.isArray(a)? `(${i+1}) ${a.join(' / ')}` : `(${i+1}) ${a??''}`).join('　');
  return { correct, user, answer: ans, per, answerView };
}
function gradeMCQ(q){
  const checked=document.querySelector('input[name="mcq"]:checked');
  const ok=checked && norm(checked.value)===norm(q.答え);
  return { correct: !!ok, user: checked? checked.value : '', answer: q.答え };
}
function gradeShort(q){
  const v=document.getElementById('short-answer')?.value||'';
  const ansArr = Array.isArray(q.答え) ? q.答え : (typeof q.答え==='string' ? q.答え.split(/\s*\/\s*|\n/).filter(Boolean) : []);
  const ok = ansArr.length ? ansArr.some(a=>norm(a)===norm(v)) : norm(v)===norm(q.答え||'');
  return { correct: ok, user: v, answer: q.答え, answerView: Array.isArray(q.答え)? q.答え.join(' / ') : q.答え };
}
function gradeOrder(q){
  const lis=Array.from(document.querySelectorAll('#order-list li'));
  const userSeq=lis.map(li=>li.childNodes[0].textContent.trim());
  let ansSeq=[];
  if(Array.isArray(q.答え)) ansSeq=q.答え.map(String);
  else if(typeof q.答え==='string'){
    const parsed = tryParseJsonStringMaybeArray(q.答え);
    if (Array.isArray(parsed)) ansSeq = parsed.map(String);
    else ansSeq=q.答え.split(/[,、]\s*/).map(s=>s.trim()).filter(Boolean);
  }
  const ok=ansSeq.length && ansSeq.every((v,i)=> (v===userSeq[i]));
  return { correct: ok, user: userSeq, answer: ansSeq, answerView: ansSeq.join(' → ') };
}
function showVerdict(correct, q, g){
  els.result.innerHTML = '';
  const badge = document.createElement('span');
  badge.className = 'badge ' + (correct?'ok':'ng');
  badge.innerHTML = correct ? '✅ 正解' : '✖ 不正解';
  els.result.append(badge);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.innerHTML = '<span class="muted">ヒント：</span>' + makeHint(q);
  els.result.append(hint);

  // reset explain box; keep hidden until user reveals
  els.explain.style.display='none';
  els.explain.innerHTML = '';
  const expTitle = document.createElement('div'); expTitle.className='title'; expTitle.textContent='解説・正解';
  const correctLine = document.createElement('div');
  const aview = g.answerView || (Array.isArray(g.answer)? g.answer.join(' / ') : (g.answer ?? ''));
  correctLine.innerHTML = '<b>正解：</b> ' + (aview || '');
  const explText = document.createElement('div');
  const e = q.解説 && String(q.解説).trim() ? q.解説 : '（解説は未登録）';
  explText.innerHTML = '<b>解説：</b> ' + e;
  els.explain.append(expTitle, correctLine, explText);
  if(q.根拠 && (q.根拠.法令ID || q.根拠.条文)){
    const ref = document.createElement('div');
    ref.innerHTML = '<b>根拠：</b> ' + (q.根拠.法令ID||'') + ' ' + (q.根拠.条文||'');
    els.explain.append(ref);
  }

  // confidence buttons appear after any grading
  els.confidence.style.display='inline-flex';
}
function gradeCurrent(){
  const q = QUESTIONS[IDX]; if(!q) return;
  let g;
  if(q.形式==='fill') g=gradeFill(q);
  else if(q.形式==='mcq' || q.形式==='truefalse') g=gradeMCQ(q);
  else if(q.形式==='short') g=gradeShort(q);
  else if(q.形式==='order') g=gradeOrder(q);
  else g={correct:false, user:'', answer:''};

  attempted++; if(g.correct) correctCount++; updateScoreboard();
  history.push({ id:q.id, correct:g.correct, user:g.user, answer:g.answer, subject:q.科目, form:q.形式 });

  showVerdict(g.correct, q, g);
  scrollIntoViewSmooth(els.result);
  // auto-add wrong to wrongbook
  if(!g.correct){ wrongbookAddOrUpdate(q.id, 0); }
}
els.submit.addEventListener('click', gradeCurrent);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ gradeCurrent(); }
  if(e.key.toLowerCase()==='n'){ goNext(); }
});

/* ====== 二段階リビール ====== */
els.revealExplain.addEventListener('click', ()=>{
  els.explain.style.display='block';
  scrollIntoViewSmooth(els.explain);
});
els.revealAnswer.addEventListener('click', ()=>{
  const t = els.explain.querySelector('div:nth-child(2)');
  if(t){ t.style.fontWeight='700'; t.style.background='#fff'; t.style.border='1px solid var(--line)'; t.style.padding='6px 8px'; t.style.borderRadius='8px'; }
  els.explain.style.display='block';
  scrollIntoViewSmooth(els.explain);
});

/* ====== 誤答ノート & 間隔反復 ====== */
function loadWrongbook(){
  try{ return JSON.parse(localStorage.getItem(WRONGBOOK_KEY)||'{}'); }catch(_){ return {}; }
}
function saveWrongbook(obj){
  localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(obj));
}
function wrongbookAddOrUpdate(id, confidence){
  const wb = loadWrongbook();
  const now = Date.now();
  const ent = wb[id] || { id, streak: 0, nextDue: now };
  if(confidence>0){
    // simple scheduler
    // 1:6h, 2:1d, 3:3d, 4:7d (if correct and conf high, extend; if wrong handled elsewhere)
    const mult = {1: 6*3600*1000, 2: 24*3600*1000, 3: 3*24*3600*1000, 4: 7*24*3600*1000}[confidence];
    ent.streak = Math.min( (ent.streak||0) + (confidence>=3 ? 1 : 0), 10 );
    ent.nextDue = now + mult;
  }else{
    // wrong answer immediate review: due in 12h
    ent.streak = 0;
    ent.nextDue = now + 12*3600*1000;
  }
  wb[id] = ent; saveWrongbook(wb);
}
function markConfidence(conf){
  const q = QUESTIONS[IDX]; if(!q) return;
  wrongbookAddOrUpdate(q.id, conf);
  // visual nudge
  els.confidence.style.display='none';
}
els.confidence.querySelectorAll('button[data-c]').forEach(btn=>{
  btn.addEventListener('click', ()=>{ markConfidence(parseInt(btn.dataset.c,10)); });
});

function pickFromWrongbook(filterDueOnly){
  const wb = loadWrongbook();
  const dueIds = Object.values(wb).filter(e=> !filterDueOnly || e.nextDue <= Date.now()).map(e=>e.id);
  let pool = ALL.filter(q=> dueIds.includes(q.id));
  return pool;
}

/* ====== 進行制御 ====== */
function show(i){ IDX=i; const q=QUESTIONS[IDX]; renderQuestion(q); }
function startQuiz(){
  const mode = els.mode.value;
  const sel = els.subject.value;
  const count = Math.max(1, parseInt(els.count.value||'20',10));
  const doShuffle = els.shuffle.checked;

  let pool;
  if(mode==='wrong'){ pool = pickFromWrongbook(false); }
  else if(mode==='due'){ pool = pickFromWrongbook(true); }
  else { pool = ALL.slice(); }

  pool = pool.filter(q=> !sel || (q.科目===sel));
  if (doShuffle) pool = pool.sort(()=>Math.random()-0.5);
  QUESTIONS = pool.slice(0, count);
  IDX=0; correctCount=0; attempted=0; history=[];
  updateScoreboard(); setProgress();
  if(QUESTIONS.length===0){
    els.qbody.textContent='該当する問題が見つかりません。設定を見直すか、誤答ノートを貯めてからお試しください。';
    return;
  }
  show(0);
  els.final.style.display='none';
}
function goNext(){
  if (IDX+1 < QUESTIONS.length) { IDX++; renderQuestion(QUESTIONS[IDX]); }
  else { finish(); }
}
els.next.addEventListener('click', goNext);

function finish(){
  const total = QUESTIONS.length;
  const rate = total? Math.round(100*correctCount/total):0;
  els.finalSummary.textContent = `正答：${correctCount} / ${total}（${rate}%）`;
  els.finalList.innerHTML='';
  history.forEach((h,i)=>{
    if(!h.correct){
      const li=document.createElement('li');
      li.textContent = `Q${i+1}（${h.id}）：あなたの回答 → ${Array.isArray(h.user)? h.user.join(' / ') : h.user}｜正解 → ${Array.isArray(h.answer)? h.answer.join(' / ') : h.answer}`;
      els.finalList.append(li);
    }
  });
  els.final.style.display='block';
  scrollIntoViewSmooth(els.final);
}
els.start.addEventListener('click', startQuiz);

/* ====== データ読み込み（questions.json 優先） ====== */
function buildSubjects(){
  const subs=[...new Set(ALL.map(q=> (q.科目 && String(q.科目).trim()) ? String(q.科目).trim() : '未分類'))].sort();
  els.subject.innerHTML = '<option value=\"\">すべて</option>' + subs.map(s=>`<option value=\"${s}\">${s}</option>`).join('');
}
async function loadQuestionsJson(){
  const urls = ['questions.json','./questions.json','data/questions.json','./data/questions.json'];
  for(const url of urls){
    try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok){ return await r.json(); } }catch(_){}
  }
  throw new Error('questions.json not found');
}
loadQuestionsJson().then(data=>{
  ALL = normalizeQuestions(data);
  buildSubjects();
  els.qbody.innerHTML = '<small class="muted">データ読込済み。設定を選んで開始してください。</small>';
}).catch(err=>{
  console.error(err);
  els.alert.textContent = 'questions.json が読み込めません。ファイルの配置を確認してください。';
  els.qbody.textContent='';
});

/* ====== 小ユーティリティ ====== */
function scrollIntoViewSmooth(el){
  try{ el.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(_){}
}
</script>
